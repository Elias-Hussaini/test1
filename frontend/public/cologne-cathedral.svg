<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0b2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d1b4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a2c6d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cathedralGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0515;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0b2e;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#7567F8;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#7567F8;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#skyGradient)"/>

  <!-- Mountains in background -->
  <path d="M0,400 Q200,350 400,380 T800,400 L800,600 L0,600 Z" fill="#1a0b2e" opacity="0.5"/>

  <!-- Rhine River -->
  <ellipse cx="400" cy="550" rx="350" ry="30" fill="#28C7E8" opacity="0.15"/>
  <ellipse cx="400" cy="555" rx="320" ry="25" fill="#28C7E8" opacity="0.1"/>

  <!-- Cathedral glow -->
  <ellipse cx="400" cy="300" rx="200" ry="200" fill="url(#glowGradient)"/>

  <!-- Cathedral Base -->
  <rect x="320" y="420" width="160" height="150" fill="url(#cathedralGradient)"/>

  <!-- Central portal -->
  <path d="M360,500 L360,570 L440,570 L440,500 L400,460 Z" fill="#050510"/>

  <!-- Left Tower -->
  <rect x="300" y="200" width="70" height="220" fill="url(#cathedralGradient)"/>
  <polygon points="300,200 335,120 370,200" fill="#050510"/>
  <rect x="325" y="120" width="20" height="80" fill="#050510"/>
  <polygon points="325,120 335,80 345,120" fill="#7567F8" opacity="0.3"/>

  <!-- Right Tower -->
  <rect x="430" y="200" width="70" height="220" fill="url(#cathedralGradient)"/>
  <polygon points="430,200 465,120 500,200" fill="#050510"/>
  <rect x="455" y="120" width="20" height="80" fill="#050510"/>
  <polygon points="455,120 465,80 475,120" fill="#7567F8" opacity="0.3"/>

  <!-- Windows with light -->
  <rect x="340" y="250" width="15" height="30" fill="#7567F8" opacity="0.4"/>
  <rect x="340" y="300" width="15" height="30" fill="#7567F8" opacity="0.4"/>
  <rect x="340" y="350" width="15" height="30" fill="#7567F8" opacity="0.4"/>

  <rect x="445" y="250" width="15" height="30" fill="#7567F8" opacity="0.4"/>
  <rect x="445" y="300" width="15" height="30" fill="#7567F8" opacity="0.4"/>
  <rect x="445" y="350" width="15" height="30" fill="#7567F8" opacity="0.4"/>

  <!-- Gothic arches -->
  <path d="M360,450 Q370,440 380,450" stroke="#7567F8" fill="none" opacity="0.3"/>
  <path d="M420,450 Q430,440 440,450" stroke="#7567F8" fill="none" opacity="0.3"/>

  <!-- Bridge -->
  <rect x="0" y="530" width="800" height="8" fill="#1a0b2e" opacity="0.6"/>
  <rect x="50" y="520" width="12" height="40" fill="#0a0515" opacity="0.4"/>
  <rect x="150" y="520" width="12" height="40" fill="#0a0515" opacity="0.4"/>
  <rect x="250" y="520" width="12" height="40" fill="#0a0515" opacity="0.4"/>
  <rect x="550" y="520" width="12" height="40" fill="#0a0515" opacity="0.4"/>
  <rect x="650" y="520" width="12" height="40" fill="#0a0515" opacity="0.4"/>
  <rect x="750" y="520" width="12" height="40" fill="#0a0515" opacity="0.4"/>
</svg>
